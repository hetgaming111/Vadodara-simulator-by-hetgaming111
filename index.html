canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;background:#0008;color:#fff;padding:6px 10px;border-radius:10px;font-size:14px}
.b{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#222;padding:6px 10px;border-radius:12px;font-size:14px;max-width:190px;text-align:center;display:none;box-shadow:0 2px 8px #0006;pointer-events:none}
#bd{background:#ffe27a}

#stick{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:120px;height:120px;border-radius:50%;background:#fff3;border:2px solid #fff8}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffc}
.btn{position:fixed;right:16px;padding:12px 16px;border-radius:14px;background:#ff8c1acc;color:#fff;font-weight:700;font-size:15px;border:0}
#ov{position:fixed;inset:0;background:#000c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:9}
#ov button{font-size:20px;padding:14px 26px;border-radius:14px;border:0;background:#ff8c1a;color:#fff;font-weight:700}
